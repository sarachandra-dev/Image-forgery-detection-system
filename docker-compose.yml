version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ml/weights:/app/ml/weights
      - ./backend/uploads:/app/backend/uploads
      - ./backend/outputs:/app/backend/outputs
    environment:
      - DEVICE=cpu
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
